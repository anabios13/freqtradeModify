    ports:
      - "8101:8101"  # Прокидываем REST API порт наружу
    volumes:
      - ./user_data:/app/user_data:ro
      - bandtasticfreqai_models_local:/app/user_data/models
      - shared_databases_local:/app/user_data/dryrun_db
      - bandtasticfreqai_logs_local:/app/user_data/logs
      - bandtasticfreqai_freqai_local:/app/user_data/freqaimodels
      - bandtasticfreqai_data_local:/app/user_data/data
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.2"
