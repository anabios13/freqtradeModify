# Автоматически сгенерированный docker-compose файл для FreqTrade
# Создан скриптом generate_docker_compose.py
# Время генерации: 2025-08-30 15:39:06

version: '3.8'

services:
  # Data Aggregator для сбора данных всех стратегий
  data-aggregator:
    image: python:3.11-slim
    container_name: data-aggregator-local
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "
        apt-get update && apt-get install -y curl &&
        pip install pandas numpy &&
        python scripts/data_aggregator.py
      "
    volumes:
      - .:/app:ro
      - shared_models_local:/app/user_data/models:ro
      - aggregated_data_local:/tmp/aggregated_data:rw
      - shared_databases_local:/app/user_data/dryrun_db:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M

  # Streamlit дашборд
  streamlit:
    image: python:3.11-slim
    container_name: freqtrade-dashboard-local
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "
        apt-get update && apt-get install -y curl &&
        pip install streamlit pandas plotly numpy &&
        streamlit run scripts/strategy_dashboard_restored.py --server.port 8501 --server.address 0.0.0.0
      "
    volumes:
      - .:/app:ro
      - aggregated_data_local:/tmp/aggregated_data:ro
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 512M
    depends_on:
      - data-aggregator

  ft_bandtastic_01:
    image: freqtradeorg/freqtrade:stable
    container_name: ft_bandtastic_02-local
    restart: unless-stopped
    working_dir: /app
    user: "1000:1000"
    command: trade --config /app/user_data/dryrun_configs/config_Bandtastic.json --strategy Bandtastic
    ports:
      - "8100:8100"  # Прокидываем REST API порт наружу
    volumes:
      - ./user_data:/app/user_data:ro
      - bandtastic_models_local:/app/user_data/models
      - shared_databases_local:/app/user_data/dryrun_db
      - bandtastic_logs_local:/app/user_data/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 512M

  ft_bandtasticfreqai_03:
    image: freqtradeorg/freqtrade:stable_freqaitorch
    container_name: ft_bandtasticfreqai_04-local
    restart: unless-stopped
    working_dir: /app
    user: "1000:1000"
